<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>價格追蹤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F4; --surface:#fff; --ink:#16212B; --dim:#61727E;
  --rule:#D5DEE4; --up:#C4302B; --down:#0B8457; --accent:#1D4E78;
  --sans:'Noto Sans TC',system-ui,'Microsoft JhengHei',sans-serif;
  --mono:'Roboto Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141B21; --surface:#1C252D; --ink:#E6EDF2; --dim:#93A3AE;
    --rule:#2E3A44; --up:#E8615C; --down:#3CB98A; --accent:#7FB0DC;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

header{padding:28px 0 0}
h1{font-size:19px;font-weight:700;margin:0 0 14px;letter-spacing:.02em}
h1 span{color:var(--dim);font-weight:400;font-size:14px;margin-left:8px}

.searchbar{position:relative}
#q{width:100%;padding:14px 44px 14px 16px;font:500 17px/1.4 var(--sans);
  color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  border-radius:3px;outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
/* 用 type=text 而不是 type=search：後者瀏覽器會自己加一顆清除鈕，
   跟 #clear 重複，而且各家關掉的方式不一樣。改用 inputmode 保留手機的搜尋鍵盤。 */
#clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  border:0;background:none;color:var(--dim);font-size:20px;cursor:pointer;
  padding:6px 10px;line-height:1;display:none}
#clear:focus-visible{outline:2px solid var(--accent)}

.status{font-size:13px;color:var(--dim);margin:0;font-variant-numeric:tabular-nums}
.status b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.statusbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 0}
#refresh{padding:5px 11px;font:500 12.5px var(--sans);color:var(--accent);
  background:var(--surface);border:1px solid var(--rule);border-radius:3px;cursor:pointer}
#refresh:disabled{color:var(--dim);cursor:default}
#refresh:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sorts{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.sortbtn{font:400 12.5px var(--sans);color:var(--ink);background:var(--bg);
  border:1px solid var(--rule);border-radius:12px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.sortbtn:hover{border-color:var(--accent)}
.sortbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.sortbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ranges{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 8px}
#coinbox[hidden]{display:none}
.headright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cfg{background:var(--surface);border:1px solid var(--rule);border-top:0;
  padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.cfg[hidden]{display:none}
.cfg label{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--dim)}
.cfg label input{flex:1 1 auto;min-width:0;padding:6px 9px;border:1px solid var(--rule);
  border-radius:3px;background:var(--bg);color:var(--ink);
  font:400 12.5px var(--mono)}
.cfg label input:focus{outline:none;border-color:var(--accent)}
.cfgfoot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cfgpv{font:400 11.5px var(--mono);color:var(--dim);overflow-wrap:anywhere;min-width:0}
.cfgnote{font-size:11.5px;color:var(--dim);line-height:1.85}
.cfgnote b{color:var(--ink);font-weight:500}
.cfgsub{padding-left:6em}
#run{font-size:12.5px;color:var(--accent)}

nav{display:flex;gap:4px;margin:18px 0 0;border-bottom:1px solid var(--rule);
  overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;font:500 14px var(--sans);color:var(--dim);
  padding:9px 12px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;
  margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.filters{background:var(--surface);border:1px solid var(--rule);border-top:0;
  padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.selects{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.selects select{flex:1 1 200px;min-width:0;padding:8px 10px;font:400 14px var(--sans);
  color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:3px}
.selects select:focus{outline:2px solid var(--accent);outline-offset:-1px}
#reset{padding:8px 12px;font:500 13px var(--sans);color:var(--accent);
  background:none;border:1px solid var(--rule);border-radius:3px;cursor:pointer}
#reset[hidden]{display:none}
/* 兩欄 grid。用 flex 的話 chip 換行會退回容器最左邊，蓋掉標籤那一欄。 */
#subs,#facets{display:flex;flex-direction:column}
.facet{display:grid;grid-template-columns:72px 1fr;column-gap:11px;
  padding:7px 0;border-top:1px solid var(--rule)}
.facet > b{font:500 12px/25px var(--sans);color:var(--dim);text-align:right;
  padding-right:11px;border-right:1px solid var(--rule)}
.facet .vals{display:flex;gap:6px;flex-wrap:wrap;min-width:0}

/* 次類採 Excel 篩選器的核取清單：預設全勾，取消某一項等於排除它。 */
.checklist{width:100%;max-height:232px;overflow-y:auto;padding:4px 0;
  background:var(--bg);border:1px solid var(--rule);border-radius:3px}
.ck{display:flex;align-items:center;gap:8px;padding:3px 10px;cursor:pointer;
  font-size:13px;line-height:1.5}
.ck:hover{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.ck input{margin:0;flex:0 0 auto;accent-color:var(--accent)}
.ck .t{min-width:0;overflow-wrap:anywhere}
.ck .n{margin-left:auto;padding-left:10px;font-family:var(--mono);font-size:11px;
  color:var(--dim);flex:0 0 auto}
.ck.all{font-weight:500;padding-bottom:6px;margin-bottom:4px;
  border-bottom:1px solid var(--rule)}
.ck.zero .t{color:var(--dim)}
.ck.one{width:auto;border:1px solid var(--rule);border-radius:3px;background:var(--bg)}

/* 價格欄頂端的酷幣開關，靠右對齊價格欄 */
.listhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--rule);border-top:0;
  padding:8px 14px;font:400 12.5px var(--sans);color:var(--dim)}
.listhead label{display:flex;align-items:center;gap:6px;cursor:pointer}
.listhead input{margin:0;accent-color:var(--accent)}
.listhead[hidden]{display:none}
.chip{font:400 13px/1 var(--sans);color:var(--ink);background:var(--bg);
  border:1px solid var(--rule);border-radius:12px;padding:5px 10px;cursor:pointer;
  white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip.wrap{white-space:normal;text-align:left;max-width:100%}
#subs:empty,#facets:empty{display:none}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chip .n{opacity:.55;font-size:11px;margin-left:3px}
.chip[aria-pressed="true"] .n{opacity:.75}
.morefacet{font:400 12px var(--sans);color:var(--accent);background:none;border:0;
  cursor:pointer;padding:5px 4px}
#list{margin:0;padding:0;list-style:none}
.row{background:var(--surface);border:1px solid var(--rule);border-top:0;
  display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;
  padding:11px 14px;cursor:pointer;align-items:baseline}
#list li:first-child .row{border-top:0}
.row:hover{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.name{font-size:14.5px;word-break:break-word}
/* 比價：用完整的原始品名去搜尋，才找得到同一支貨 */
.cmp{grid-column:3;grid-row:1;align-self:center;justify-self:end;text-decoration:none;
  font:400 12px var(--sans);color:var(--dim);border:1px solid var(--rule);
  border-radius:3px;padding:4px 9px;white-space:nowrap;line-height:1.5}
.cmp:hover{color:var(--accent);border-color:var(--accent);background:var(--bg)}
.cmp:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.meta{grid-column:1;font-size:12px;color:var(--dim)}
.price{grid-column:2;grid-row:1;min-width:8ch;text-align:right;
  font-family:var(--mono);font-size:16px;font-weight:500;
  text-align:right;white-space:nowrap}
.delta{grid-column:2/4;grid-row:2;font-family:var(--mono);font-size:12px;text-align:right;
  white-space:nowrap}
.up{color:var(--up)} .down{color:var(--down)}
.tag{display:inline-block;font-size:11px;padding:0 5px;border-radius:2px;margin-left:6px;
  vertical-align:1px;border:1px solid currentColor}
.tag.lowest{color:var(--down)} .tag.gone{color:var(--dim)} .tag.alias{color:var(--accent)}
.tag.coin{color:var(--up)}

.detail{background:var(--surface);border:1px solid var(--rule);border-top:0;padding:14px}
.stats{display:flex;flex-wrap:wrap;gap:0 26px;font-size:13px;color:var(--dim);margin:0 0 10px}
.stats b{font-family:var(--mono);font-weight:500;color:var(--ink);margin-left:5px}
svg.chart{width:100%;height:150px;display:block;overflow:visible}
.chart .axis{stroke:var(--rule);stroke-width:1}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2;
  stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart text{font:400 11px var(--mono);fill:var(--dim)}
.pts{margin:8px 0 0;font-size:12.5px;color:var(--dim);font-family:var(--mono)}
.pts.warn{font-family:var(--sans);color:var(--up)}
.chart .dot.bad{stroke:var(--dim);stroke-dasharray:2 2;fill:var(--bg)}

.msg{padding:40px 14px;text-align:center;color:var(--dim);font-size:14px}
.run{background:var(--surface);border:1px solid var(--rule);border-top:0;
  display:grid;grid-template-columns:1fr auto;gap:3px 14px;padding:11px 14px;align-items:baseline}
.run .d{font-family:var(--mono);font-size:14px}
.run .s{grid-column:1;font-size:12px;color:var(--dim)}
.run .r{grid-column:2;grid-row:1/3;align-self:center}
.run .ren{grid-column:1/3;font-size:12px;color:var(--dim);overflow-wrap:anywhere}
.howto{background:var(--surface);border:1px solid var(--rule);border-top:0;
  padding:12px 14px;font-size:13px;color:var(--dim);line-height:1.7}
.howto b{color:var(--ink);font-family:var(--mono);font-weight:500}
#more{display:block;width:100%;margin:14px 0 0;padding:11px;font:500 14px var(--sans);
  color:var(--accent);background:var(--surface);border:1px solid var(--rule);
  border-radius:3px;cursor:pointer}
/* 作者的 display:block 權重蓋過 UA 的 [hidden]{display:none}，得自己補回來 */
#more[hidden]{display:none}
footer{padding:34px 0;font-size:12px;color:var(--dim)}
footer a{color:var(--accent)}
@media (max-width:520px){ .name{font-size:14px} .price{font-size:15px} }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>價格追蹤<span>每日快照</span></h1>
  <div class="searchbar">
    <input id="q" type="text" inputmode="search" enterkeyhint="search"
           placeholder="搜尋品名，例如 9800X3D、5060Ti、990 PRO"
           autocomplete="off" spellcheck="false" aria-label="搜尋品名">
    <button id="clear" type="button" aria-label="清除搜尋">×</button>
  </div>
  <div class="statusbar">
    <p class="status" id="status">載入中…</p>
    <button id="refresh" type="button">立刻更新</button>
    <a id="run" href="#" target="_blank" rel="noopener">重新抓取</a>
  </div>
  <nav id="tabs" role="tablist">
    <button role="tab" data-view="all" aria-selected="true">全部</button>
    <button role="tab" data-view="changed" aria-selected="false">最近變價</button>
    <button role="tab" data-view="lowest" aria-selected="false">目前歷史低點</button>
    <button role="tab" data-view="new" aria-selected="false">新上架</button>
    <button role="tab" data-view="gone" aria-selected="false">已下架</button>
    <button role="tab" data-view="runs" aria-selected="false">抓取紀錄</button>
  </nav>
</header>

<div class="filters" id="filters">
  <div class="selects">
    <select id="cat" aria-label="分類"><option value="">全部分類</option></select>
    <button id="reset" type="button" hidden>清除篩選</button>
  </div>
  <div id="subs"></div>
  <div id="facets"></div>
</div>

<div class="listhead" id="listhead" hidden>
  <span class="sorts" id="sorts">排序</span>
  <span class="headright">
    <label id="coinbox" hidden><input type="checkbox" id="coin"> 價格折抵酷幣</label>
    <button class="sortbtn" id="cfgtoggle" type="button" aria-expanded="false">比價設定</button>
  </span>
</div>
<div class="cfg" id="cfg" hidden>
  <label>搜尋網址<input id="cfgurl" type="text" spellcheck="false" autocapitalize="off"></label>
  <label>追加關鍵字<input id="cfgextra" type="text" spellcheck="false" autocapitalize="off"
         placeholder="接在品名後面，例如店名；前面加 - 可排除"></label>
  <label>捲動並標示<input id="cfgmark" type="text" spellcheck="false" autocapitalize="off"
         placeholder="開啟後捲到這段文字；用逗號分兩段＝標示範圍（Firefox 不支援）"></label>
  <div class="cfgfoot">
    <span class="cfgpv" id="cfgpv"></span>
    <button class="sortbtn" id="cfgreset" type="button">還原預設</button>
  </div>
  <div class="cfgnote">只存在這台裝置的瀏覽器，不會進 repo，換裝置要重設一次。<br>
    <b>追加關鍵字</b>：可填寫特定的網站名稱<br>
    <b>捲動並標示</b>：自動捲至搜尋結果的特定文字<br>
    <span class="cfgsub">抓第一個出現的位置，支援範圍選取（起點,終點）</span></div>
</div>
<ul id="list"></ul>
<div class="msg" id="msg" hidden></div>
<button id="more" type="button" hidden>顯示全部</button>

<footer>
  價格資料僅供參考，實際成交價以店家為準。<br>
  <a id="repo" href="#">原始碼與資料</a>
</footer>
</div>

<script>
const NT = n => n.toLocaleString('en-US');
const $ = s => document.querySelector(s);
// 從品名與次類抽出可篩選的規格。次類由來源站分好，比品名可靠，優先採用。
// 品名開頭常掛活動標語：【八方來財】、[限組裝]、(0801-0810 92折優惠)、〈套裝搭購優惠〉。
// 一律整段剝掉，直到剝出真正的品名為止；只挑關鍵字剝的話會漏掉大半，
// 品牌就會變成「【華碩家用筆」這種被空白截斷的殘句。
const LEAD_MARK = /^[\s　★◆▼※•↓~!！{}｛｝]+/;
const LEAD_BRACKET = /^[【\[［（(〈<][^】\]］）)〉>]*[】\]］）)〉>]/;
// 標語剝掉後常還剩「8/31前 買」「6/1~6/30購買」這種活動期間的字樣。
// 日期只認 m/d 的寫法，不能一律吃掉數字，否則 1MORE 這類品牌會被咬掉。
const LEAD_NOISE = /^(?:[+＋]|購買|買|\d{1,2}\/\d{1,2}(?:[~～-]\d{1,2}\/\d{1,2})?(?:前|止)?)/;

function stripLead(s){
  s = s.replace(LEAD_MARK, '');
  for (let i = 0; i < 6; i++){
    const m = s.match(LEAD_BRACKET) || s.match(LEAD_NOISE);
    if (!m) break;
    const rest = s.slice(m[0].length).replace(LEAD_MARK, '');
    if (!rest) break;            // 整個品名就是一組括號，剝光反而沒東西可用
    s = rest;
  }
  return s;
}

function brandOf(name){
  const s = stripLead(name);
  // 開頭殘留的符號要先去掉，否則會連著品牌一起被當成一個詞，
  // 保底又只切 6 個字元，就成了「{Cherr」「{Couga」這種東西。
  const first = (s.split(/[\s　/、,，]/)[0] || '').replace(/^[^\w\u4e00-\u9fff]+/, '');
  const zh = first.match(/^[\u4e00-\u9fff]+/);       // 「美光Micron」取「美光」
  if (zh && zh[0].length >= 2) return zh[0];
  const en = first.match(/^[A-Za-z0-9][A-Za-z0-9\-.]*/);   // 1MORE 這種數字開頭的也算
  if (en && en[0].length >= 2) return en[0].toUpperCase();
  return zh ? zh[0] : (en ? en[0].toUpperCase() : '其他');
}

// 螢幕的介面代碼：〈2H1P1C〉= 2 個 HDMI + 1 個 DP + 1 個 USB-C
const PORT_NAME = { H:'HDMI', P:'DisplayPort', C:'USB-C', A:'D-Sub', D:'DVI' };

// 介面代碼寫在〈〉裡，但不一定在最前面（可攜式螢幕是〈15.6吋/1H2C/IPS〉），
// 所以逐段檢查而不是只看開頭。每個代碼都一定帶數字，要求數字才不會把
// 「PD」「240Hz」這種段落誤判成介面。
const PORT_CODE = /^(?:\d+(?:TB\d?|[HPCAD]))+$/;

function portsOf(name){
  const inner = name.match(/[〈<]([^〉>]*)[〉>]/);
  for (const seg of (inner ? inner[1] : name).split(/[\/、]/)){
    const t = seg.trim();
    if (!PORT_CODE.test(t)) continue;
    const out = [];
    for (const g of t.matchAll(/(\d+)(TB\d?|[HPCAD])/g)){
      const key = g[2].startsWith('TB') ? 'Thunderbolt' : PORT_NAME[g[2]];
      if (key) out.push([key, +g[1]]);
    }
    return out;
  }
  return [];
}

function attrsOf(it){
  const n = it.n, g = it.g || '', a = {};
  a.brand = [brandOf(n)];

  // 尺寸與解析度來自次類，例如「27吋(2560*1440)(4K 16:9)」
  let m = g.match(/(\d+(?:\.\d+)?)吋/);
  if (m) a.size = [m[1] + '吋'];
  m = g.match(/\((\d{3,5})\s*[*xX×]\s*(\d{3,5})\)/);
  if (m) a.res = [`${m[1]}×${m[2]}`];
  m = g.match(/\((?:\d?[45689]K\s*)?(\d+:\d+)\)/);
  if (m) a.ratio = [m[1]];
  m = g.match(/\b([45689]K)\b/);
  if (m) a.tier = [m[1]];

  // 面板、更新率、介面、賣點來自品名
  const panel = [];
  if (/QD[-\s]?OLED/i.test(n)) panel.push('QD-OLED');
  else if (/\bOLED\b/i.test(n)) panel.push('OLED');
  if (/Mini\s?LED/i.test(n)) panel.push('Mini LED');
  if (/\bIPS\b/i.test(n)) panel.push('IPS');
  if (/\bVA\b/.test(n)) panel.push('VA');
  if (/\bTN\b/.test(n)) panel.push('TN');
  if (panel.length) a.panel = panel;

  m = n.match(/(\d{2,3})\s*Hz/i);
  if (m){
    const hz = +m[1];
    a.hz = [hz >= 240 ? '240Hz 以上' : hz >= 165 ? '165–239Hz' :
            hz >= 120 ? '120–164Hz' : hz >= 100 ? '100–119Hz' : '100Hz 以下'];
  }

  const ports = portsOf(n);
  // RJ-45 不在〈2H1P1C〉那組代碼裡，是另外寫在品名上的
  if (/RJ-?45/i.test(n)) ports.push(['RJ-45', 1]);
  if (ports.length){
    a.port = [...new Set(ports.map(p => p[0]))];
    // 同一種介面幾個孔也常常是選購重點，例如 2H 跟 3H 差很多
    a.portn = ports.map(([k, c]) => `${k}×${c}`);
  }

  // HDR 分等級。400 跟 1400 差很多，併成一個「HDR」等於沒篩。
  m = n.match(/\bHDR\s?(10|400|500|600|1000|1400)\b/i);
  if (m) a.hdr = ['HDR' + m[1]];
  else if (/DisplayHDR|\bHDR\b/i.test(n)) a.hdr = ['HDR'];

  // 曲率半徑，數字越小弧度越大。
  // 後方不可接英文字母，否則機殼風扇的 1800RPM 會被誤判為曲率。
  m = n.match(/(?:^|[^0-9A-Za-z])(\d{3,4})R(?![0-9A-Za-z])/);
  if (m && +m[1] >= 800 && +m[1] <= 4000) a.curve = [m[1] + 'R'];
  else if (/曲面/.test(n)) a.curve = ['曲面（未標曲率）'];
  else if (a.panel || a.size) a.curve = ['平面'];   // 有面板或尺寸才算是顯示器

  const feat = [];
  if (/可升降|升降旋轉|人體工學|可昇降/.test(n)) feat.push('可升降旋轉');
  if (/含喇叭|內建喇叭/.test(n)) feat.push('含喇叭');
  if (/無亮點|零亮點|無亮暗點/.test(n)) feat.push('無亮點保固');
  if (/觸控/.test(n)) feat.push('觸控');

  if (/\bPD\b|供電\d+W|反向充電/.test(n)) feat.push('PD 供電');
  if (/FreeSync|G[-\s]?Sync|Adaptive[-\s]?Sync/i.test(n)) feat.push('同步技術');
  // ARGB 與一般 RGB 是不同東西（機殼風扇差很多），分開列
  if (/\bA[-.\s]?RGB\b/i.test(n)) feat.push('ARGB');
  else if (/\bRGB\b/i.test(n)) feat.push('RGB');
  if (/插拔/.test(n)) feat.push('熱插拔');
  if (/智慧螢幕|Google\s?TV|Airplay/i.test(n)) feat.push('智慧螢幕');
  if (/Thunderbolt|\bTB[45]\b/i.test(n)) feat.push('Thunderbolt');
  if (/麥克風/.test(n)) feat.push('麥克風');
  // 高更新率螢幕常有「4K-160Hz／FHD-320Hz 切換」這種雙模式
  if (/切換|雙模式/.test(n)) feat.push('解析度切換');
  if (feat.length) a.feat = feat;

  // 連線方式。三模的品名會同時寫出有線／無線／藍牙，所以三種都給，
  // 你要用哪一種角度篩都行。
  const conn = [];
  if (/三模/.test(n)) conn.push('三模');
  if (/雙模/.test(n)) conn.push('雙模');
  if (/無線/.test(n)) conn.push('無線');
  if (/有線/.test(n)) conn.push('有線');
  if (/藍[牙芽]/.test(n)) conn.push('藍牙');
  if (conn.length) a.conn = conn;

  // 顏色。來源站大量存在同型號不同色的品項，而且常帶修飾詞
  //（熔岩紅、冰川銀、太空灰、幻潮黑）。一律歸到最後那個顏色字，
  // 否則「熔岩紅」會自成一格，跟「紅」分開。
  // 前面要求是分隔符號，「銀欣」「金牌」「藍標」才不會被當成顏色；
  // 但「白金」這種前後都合法的還是會中，只能列外。
  // 螢幕的規格幾乎都包在〈〉裡，少了它「蘇打藍〉」「粉紅色〉」會整個漏掉
  const DELIM = '\\s\\/（()）【】｛｝〈〉<>,，、-';
  const COLOR = new RegExp(`(?:^|[${DELIM}])` +
    `([\\u4e00-\\u9fff]{0,2}[黑白銀灰紅藍粉綠金紫橘黃])(?:色|版|款|色版)?` +
    `(?=[${DELIM}]|$)`, 'g');
  const NOT_COLOR = /^(白金|鈦金|鍍金|純金|黃金|合金|全金|烤漆)$/;
  // 粉紅是粉色系，取最後一字會變成「紅」，跟一般認知不合
  const COLOR_FIX = { 粉紅: '粉' };
  for (const m of n.matchAll(COLOR)){
    if (NOT_COLOR.test(m[1])) continue;
    a.color = [COLOR_FIX[m[1].slice(-2)] || m[1].slice(-1)];
    break;
  }

  // 非螢幕也用得上：容量與保固
  m = n.match(/(\d+(?:\.\d+)?)\s*(TB|GB)\b/i);
  if (m) a.cap = [m[1] + m[2].toUpperCase()];
  m = n.match(/(\d+|[一二兩三四五六七八九十])\s*年(?:保|保固|全球保|)/);
  if (m){
    const map = {一:1, 二:2, 兩:2, 三:3, 四:4, 五:5, 六:6, 七:7, 八:8, 九:9, 十:10};
    const y = map[m[1]] || parseInt(m[1], 10);
    if (y >= 1 && y <= 12) a.warranty = [y + ' 年保'];
  }
  return a;
}


// 篩選面板的分組定義，順序即畫面上由上而下的排列。
const FACET_DEFS = [
  ['brand','品牌'], ['size','尺寸'], ['res','解析度'], ['tier','等級'],
  ['ratio','比例'], ['panel','面板'], ['curve','曲率'], ['hz','更新率'],
  ['port','連接介面'], ['portn','介面數量'], ['hdr','HDR'],
  ['conn','連線'], ['feat','特性'], ['color','顏色'], ['cap','容量'], ['warranty','保固'],
];
const PICKED = {};          // {facet: Set(值)}
let SUBS = null;            // 勾選中的次類。null 代表全勾，沒動過
const EXPANDED = new Set(); // 哪幾組按了「更多」
const FACET_SHOWN = 20;     // 一組超過這個數量才收合，其餘藏在「更多」後面

let MINED = {};    // {分類: [[值,…], …]}  由 scripts/facets.py 每次抓取後重算

function buildAttrs(){
  for (const it of ITEMS) it._a = attrsOf(it);
  applyMined();
}

// 探勘是把品名切成片段後比對的，前端也得照同一種切法，
// 否則「M-ATX」的品名含有 ATX 三個字，就會被算進 ATX 那一格。
const SEG_SPLIT = /[/／、,，|｜〈〉<>【】\[\]()（）]/;

function segsOf(name){
  const out = new Set();
  for (let seg of name.split(SEG_SPLIT)){
    seg = seg.replace(/^[\s　.。:：*+~-]+|[\s　.。:：*+~-]+$/g, '');
    if (seg.length > 1 && seg.length <= 14) out.add(seg);
  }
  return out;
}

function applyMined(){
  for (const it of ITEMS){
    const groups = MINED[it.c];
    if (!groups) continue;
    const segs = segsOf(it.n);
    for (let gi = 0; gi < groups.length; gi++){
      const hit = groups[gi].filter(v => segs.has(v));
      if (hit.length) it._a['auto' + gi] = hit;
    }
  }
}

// 自動組無指定名稱，以組內最常見的值為標題，顯示為「ATX 等」
function autoLabel(cat, gi){
  const g = (MINED[cat] || [])[gi];
  return g ? g[0] + ' 等' : '其他';
}

let CAT_VIEW = null;    // 分類選單是照哪個分頁建的
let CAT_RANK = new Map();   // 分類 → 來源站頁面上的位置

// 選單跟著分頁重建。品項的 c 存的是它最後一次被看到時的分類，來源站改過名的
// 舊分類（例如「手機｜平板｜筆電｜穿戴」）只會留在改名前就下架的品項身上，
// 一律列出來的話，在架分頁會出現一票點進去空無一物的分類。
function fillCategories(pool){
  if (CAT_VIEW === VIEW) return;
  CAT_VIEW = VIEW;
  const counts = new Map();
  const first = new Map();   // 每個分類在來源站頁面上最早出現的位置
  for (const it of pool){
    if (!it.c) continue;
    counts.set(it.c, (counts.get(it.c) || 0) + 1);
    const o = ordOf(it);
    if (o < (first.get(it.c) ?? Infinity)) first.set(it.c, o);
  }
  const keep = $('#cat').value;
  if (keep && !counts.has(keep)) counts.set(keep, 0);
  // 順序的三層依據：抓取記下的分類順序 → 該分類第一筆品項的位置 → 筆劃。
  // 前兩層都來自來源站；第三層只在舊資料或來源站已經改掉的舊分類名才會用到。
  const rank = c => CAT_RANK.has(c) ? CAT_RANK.get(c)
                  : (first.get(c) ?? Infinity) + CAT_RANK.size;
  const cats = [...counts.keys()].sort((a,b) =>
    rank(a) - rank(b) || a.localeCompare(b,'zh-Hant'));
  $('#cat').innerHTML =
    `<option value="">全部分類（${NT(pool.length)}）</option>` +
    cats.map(c => `<option value="${esc(c)}">${esc(c)}（${NT(counts.get(c))}）</option>`).join('');
  $('#cat').value = keep;
}

let SUB_DOMAIN = [];        // 目前分類下所有次類，供全選計算用
let COIN = false;           // 價格是否折抵酷幣
let COIN_ONLY = false;      // 只看有酷幣的品項
let HAS_COIN = false;       // 這批資料裡到底有沒有酷幣（舊資料沒有這個欄位）
let HAS_ORDER = false;      // 有沒有來源站的排列順序（舊資料沒有這個欄位）

// o 是這筆在來源站頁面上的位置。預設排序照它走，看到的順序才跟來源站一致。
// 舊資料沒有 o，就退回原本的價格排序。
const ordOf = it => typeof it.o === 'number' ? it.o : Infinity;
const byOrder = (a,b) => HAS_ORDER ? ordOf(a) - ordOf(b) : netOf(a) - netOf(b);

// 來源站用全形大括號把型號框起來（｛DELL P2725QE｝），顯示時拿掉比較好讀。
// 兩邊都是文字才補空格，否則會黏成「U7-155USFL14-54M」；碰到〈】) 這類符號就直接刪。
// 只動畫面：品名是品項的識別依據，改了存下來的字串，走勢圖會全部斷掉重算。
const wordish = c => /[\w\u4e00-\u9fff]/.test(c || '');
const showName = n => n
  .replace(/[｛｝{}]/g, (m, i, str) =>
    wordish(str[i-1]) && wordish(str[i+1]) ? ' ' : '')
  .replace(/\s{2,}/g, ' ').trim();

// 排序。四個鍵一律定義成「由小到大」，方向另外用 SORT_DIR 控制。
// 日期在「已下架」看的是最後出現日，其他分頁看的是變價日。
const dateOf = it => (VIEW === 'gone' ? it.l : it.pd) || '';
const SORT_KEYS = {
  src:   byOrder,
  name:  (a,b) => a.n.localeCompare(b.n, 'zh-Hant'),
  price: (a,b) => netOf(a) - netOf(b),
  date:  (a,b) => dateOf(a).localeCompare(dateOf(b)),
};
const SORT_LABEL = { src:'原站順序', name:'品名', price:'價格', date:'日期' };
// 每個分頁的預設排序。日期類分頁預設新的在前，也就是這些分頁原本的樣子。
const VIEW_SORT = { all:['src',1], changed:['date',-1], lowest:['date',-1],
                    new:['date',-1], gone:['date',-1] };
let SORT = 'src', SORT_DIR = 1;

// 同分時一律回到原站順序再回到 id，讓排序穩定、重畫不會跳動
function sortCmp(){
  const base = SORT_KEYS[SORT];
  return (a,b) => SORT_DIR * base(a,b) || ordOf(a) - ordOf(b) ||
                  a.id.localeCompare(b.id);
}

function renderSorts(){
  $('#sorts').innerHTML = '排序' + Object.keys(SORT_KEYS).map(k =>
    `<button class="sortbtn" type="button" data-sort="${k}"` +
    ` aria-pressed="${SORT === k}">${SORT_LABEL[k]}` +
    `${SORT === k ? (SORT_DIR > 0 ? ' ↑' : ' ↓') : ''}</button>`).join('');
}

// 酷幣是結帳當下直接折抵的金額，所以只影響「現價」。歷史價格與最高最低都維持原價，
// 因為過去每天的酷幣額度沒有被記錄下來，混著算會讓走勢圖對不上。
// 折抵大於等於售價一定是資料有問題，當成沒有，免得畫面出現負數價格。
const kOf = it => { const k = it.k || 0; return k > 0 && k < it.p ? k : 0; };
const netOf = it => COIN ? it.p - kOf(it) : it.p;

// 次類清單的內容取自「分頁＋分類」，不隨搜尋字變動——否則打字時整排會忽隱忽現。
// 右邊的筆數才套用搜尋結果。
function renderSubs(domain, counted){
  const box = $('#subs');
  if (!$('#cat').value){ box.innerHTML = ''; SUB_DOMAIN = []; return; }

  const names = new Set();
  for (const it of domain) names.add(it.g || '');
  if (SUBS) for (const v of SUBS) names.add(v);
  // 照來源站頁面上的順序：拿該次類第一筆品項的位置當排序依據。
  // 沒有 o 的舊資料才退回筆劃。未分類一律排最後。
  const firstAt = new Map();
  for (const it of domain){
    const g = it.g || '', o = ordOf(it);
    if (o < (firstAt.get(g) ?? Infinity)) firstAt.set(g, o);
  }
  const at = g => firstAt.get(g) ?? Infinity;
  SUB_DOMAIN = [...names].sort((a,b) =>
    (a === '' ? 1 : b === '' ? -1 : 0) ||
    at(a) - at(b) || a.localeCompare(b,'zh-Hant'));
  if (!SUB_DOMAIN.length){ box.innerHTML = ''; return; }

  const counts = new Map();
  for (const it of counted){
    const k = it.g || '';
    counts.set(k, (counts.get(k) || 0) + 1);
  }
  const on = v => !SUBS || SUBS.has(v);
  const picked = SUB_DOMAIN.filter(on).length;

  const rows = SUB_DOMAIN.map(v => {
    const n = counts.get(v) || 0;
    return `<label class="ck${n ? '' : ' zero'}">` +
      `<input type="checkbox" data-sub="${esc(v)}"${on(v) ? ' checked' : ''}>` +
      `<span class="t">${v ? esc(shortSub(v)) : '（未分類）'}</span>` +
      `<span class="n">${NT(n)}</span></label>`;
  }).join('');

  const prev = box.querySelector('.checklist');
  const top = prev ? prev.scrollTop : 0;
  const nCoin = domain.filter(i => kOf(i) > 0).length;
  const coinRow = nCoin
    ? '<div class="facet"><b>酷幣</b><div class="vals">' +
      `<label class="ck one"><input type="checkbox" data-coin-only` +
      `${COIN_ONLY ? ' checked' : ''}>` +
      `<span class="t">只看有酷幣</span><span class="n">${NT(nCoin)}</span></label>` +
      '</div></div>'
    : '';
  box.innerHTML = coinRow +
    '<div class="facet"><b>次類</b><div class="vals"><div class="checklist">' +
    `<label class="ck all"><input type="checkbox" data-all` +
    `${picked === SUB_DOMAIN.length ? ' checked' : ''}>` +
    `<span class="t">（全選）</span>` +
    `<span class="n">${NT(counted.length)}</span></label>` +
    rows + '</div></div></div>';

  const all = box.querySelector('[data-all]');
  all.indeterminate = picked > 0 && picked < SUB_DOMAIN.length;
  box.querySelector('.checklist').scrollTop = top;
}

// 次類名稱常附帶保固說明，選單中略去
const shortSub = g => g.replace(/[〈<（(]亮暗點[^〉>）)]*[〉>）)]/,'').trim();

function matchFacets(it){
  for (const [key, set] of Object.entries(PICKED)){
    if (!set.size) continue;
    const vals = it._a[key];
    if (!vals || !vals.some(v => set.has(v))) return false;
  }
  return true;
}

function activeDefs(){
  const cat = $('#cat').value;
  const defs = [...FACET_DEFS];
  const groups = cat ? (MINED[cat] || []) : [];
  for (let gi = 0; gi < groups.length; gi++)
    defs.push(['auto' + gi, autoLabel(cat, gi)]);
  return defs;
}

function renderFacets(pool){
  const box = $('#facets');
  // 未選分類時規格面板沒有意義：品牌會列出幾百個、規格組跨分類混在一起。
  if (!$('#cat').value){ box.innerHTML = ''; return; }
  const defs = activeDefs();
  const counts = {};
  for (const [key] of defs) counts[key] = new Map();
  for (const it of pool){
    for (const [key] of defs){
      for (const v of (it._a[key] || []))
        counts[key].set(v, (counts[key].get(v) || 0) + 1);
    }
  }
  let html = '';
  for (const [key, label] of defs){
    const picked = PICKED[key] || new Set();
    let vals = [...counts[key].entries()].filter(([v,n]) => n > 1 || picked.has(v));
    if (vals.length < 2 && !picked.size) continue;
    vals.sort(sorterFor(key));
    const open = EXPANDED.has(key);
    const shown = open ? vals : vals.slice(0, FACET_SHOWN);
    html += `<div class="facet"><b>${label}</b><div class="vals">` +
      shown.map(([v,n]) =>
        `<button class="chip" type="button" data-f="${key}" data-v="${esc(v)}"` +
        ` aria-pressed="${picked.has(v)}">${esc(v)}<span class="n">${n}</span></button>`).join('') +
      (vals.length > FACET_SHOWN
        ? `<button class="morefacet" type="button" data-more="${key}">` +
          (open ? '收合' : `更多 ${vals.length - FACET_SHOWN}`) + '</button>'
        : '') + '</div></div>';
  }
  box.innerHTML = html;
}

function sorterFor(key){
  if (key === 'size' || key === 'cap')
    return (a,b) => parseFloat(a[0]) - parseFloat(b[0]);
  if (key === 'res')
    return (a,b) => parseInt(a[0]) - parseInt(b[0]);
  if (key === 'hdr')   // 未標等級的排最前面，其餘照數字由小到大
    return (a,b) => (+a[0].slice(3) || 0) - (+b[0].slice(3) || 0);
  if (key === 'portn') // 同一種介面的各種數量要排在一起
    return (a,b) => a[0].localeCompare(b[0], 'zh-Hant');
  if (key === 'hz'){
    const ord = ['100Hz 以下','100–119Hz','120–164Hz','165–239Hz','240Hz 以上'];
    return (a,b) => ord.indexOf(a[0]) - ord.indexOf(b[0]);
  }
  return (a,b) => b[1] - a[1];      // 其餘按數量多寡
}

function anyFilter(){
  return $('#cat').value || SUBS || COIN_ONLY ||
    Object.values(PICKED).some(s => s.size);
}

let ITEMS = [], VIEW = 'all', SHOWN = 0, RESULT = [], OPEN = null;
let OPEN_IT = null, OPEN_SERIES = null;   // 展開中的品項，切換區間時直接重畫
let RUNS = [];                            // 抓取紀錄，來自 data/runs.json
const PAGE = 120, shardCache = new Map();

const base = location.pathname.replace(/[^/]*$/, '');
const repoUrl = 'https://github.com/' + location.hostname.split('.')[0] +
  base.replace(/\/$/, '');
$('#repo').href = repoUrl;
$('#run').href = repoUrl + '/actions';

let DATA_STAMP = null;      // 上一次載到的 updated 值，用來判斷有沒有新資料

// force=true 時在網址後面掛一個時間戳。GitHub Pages 會把 json 快取十分鐘左右，
// 不繞開的話按了更新也只會拿到同一份舊檔案。
async function loadData(force){
  const bust = force ? '?t=' + Date.now() : '';
  const [d, mined, runs] = await Promise.all([
    fetch(base + 'data/items.json' + bust)
      .then(r => r.ok ? r.json() : Promise.reject(r.status)),
    fetch(base + 'data/facets.json' + bust)
      .then(r => r.ok ? r.json() : {}).catch(() => ({})),
    fetch(base + 'data/runs.json' + bust)
      .then(r => r.ok ? r.json() : {}).catch(() => ({})),
  ]);
  RUNS = (runs && runs.runs) || [];
  const same = DATA_STAMP !== null && DATA_STAMP === d.updated;
  DATA_STAMP = d.updated;
  ITEMS = d.items;
  // cats 是 2026-09 之後的抓取才會寫入的欄位。舊資料沒有就退回筆劃排序。
  CAT_RANK = new Map((d.cats || []).map((c,i) => [c,i]));
  // k 欄位是 2026-09 之後的抓取才有，舊資料沒有就整組不顯示
  HAS_COIN = ITEMS.some(i => kOf(i) > 0);
  HAS_ORDER = ITEMS.some(i => typeof i.o === 'number');
  $('#listhead').hidden = false;
  $('#coinbox').hidden = !HAS_COIN;
  MINED = mined;
  buildAttrs();
  shardCache.clear();       // 走勢圖的分片快取跟著換掉，否則展開看到的還是舊價格

    `追蹤 <b>${NT(d.count)}</b> 項 · 資料更新於 <b>${d.updated}</b>`;
  render();
  return same;
}

function score(item, terms){
  const hay = (item.n + ' ' + item.c + ' ' + item.g).toLowerCase();
  for (const t of terms) if (!hay.includes(t)) return -1;
  return item.n.toLowerCase().indexOf(terms[0]) === 0 ? 2 : 1;
}

function compute(){
  const terms = $('#q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const cat = $('#cat').value;
  let out = ITEMS;
  if (VIEW === 'all') out = out.filter(i => !i.x);
  else if (VIEW === 'gone') out = out.filter(i => i.x);
  else if (VIEW === 'changed') out = out.filter(i => i.pv !== null && !i.x);
  else if (VIEW === 'lowest') out = out.filter(i => !i.x && i.np > 1 && i.p <= i.lo);
  else if (VIEW === 'new') out = out.filter(i => !i.x && i.np === 1);
  fillCategories(out);
  if (cat) out = out.filter(i => i.c === cat);

  // 各層的選項數都統計「尚未套用該層篩選」的結果，避免勾選後其他選項歸零
  const searched = list => terms.length ? list.filter(i => score(i, terms) > 0) : list;
  renderSubs(out, searched(out));
  if (cat && COIN_ONLY) out = out.filter(i => kOf(i) > 0);
  if (cat && SUBS) out = out.filter(i => SUBS.has(i.g || ''));
  renderFacets(searched(out));
  if (cat) out = out.filter(matchFacets);

  const cmp = sortCmp();
  if (terms.length){
    // 有搜尋字時符合度優先（開頭吻合的排前面），同一級之內才照選的排序
    out = out.map(i => [score(i, terms), i]).filter(x => x[0] > 0);
    out.sort((a,b) => b[0]-a[0] || cmp(a[1], b[1]));
    out = out.map(x => x[1]);
  } else if (VIEW === 'changed' && SORT === 'date'){
    // 這個分頁的預設是「最近變動的在前，同一天則跌漲幅大的在前」
    out = [...out].sort((a,b) => SORT_DIR * dateOf(a).localeCompare(dateOf(b)) ||
      Math.abs(b.p-b.pv)/b.pv - Math.abs(a.p-a.pv)/a.pv);
  } else {
    out = [...out].sort(cmp);
  }
  renderSorts();
  $('#reset').hidden = !anyFilter();
  return out;
}

// 比價連結。用未經處理的原始品名——大括號、【限搭機】那些都留著，
// 因為其他店家轉貼的字串常常一模一樣，整串下去反而更容易對到同一支貨。
//
// 這是預設值，網頁上「比價設定」改過的會存在瀏覽器裡蓋掉它（只在這台裝置）。
// 常見的替代網址：
//   Google 購物   https://www.google.com/search?tbm=shop&q=
//   Bing          https://www.bing.com/search?q=
//   DuckDuckGo    https://duckduckgo.com/?q=
// 想直接搜某家店的站內搜尋也可以，把那家店的搜尋網址填進「比價設定」就行，
// 不必寫在這裡——這個 repo 是公開的，店名留在程式碼裡沒有必要。
const SEARCH_DEFAULT = { url: 'https://www.google.com/search?q=', extra: '', mark: '' };
const SEARCH_KEY = 'pt.search';
let SEARCH = { ...SEARCH_DEFAULT };

function loadSearchCfg(){
  try {
    const raw = localStorage.getItem(SEARCH_KEY);
    if (raw) SEARCH = { ...SEARCH_DEFAULT, ...JSON.parse(raw) };
  } catch (e){ /* 無痕視窗讀不到，就用預設值 */ }
}

function saveSearchCfg(){
  try {
    // 跟預設一樣就不留東西在瀏覽器裡
    if (SEARCH.url === SEARCH_DEFAULT.url && !SEARCH.extra && !SEARCH.mark)
      localStorage.removeItem(SEARCH_KEY);
    else localStorage.setItem(SEARCH_KEY, JSON.stringify(SEARCH));
  } catch (e){}
}

// 追加關鍵字接在整串品名後面，用空白隔開。
// mark 是瀏覽器的文字片段（#:~:text=）：開啟後自動捲到那段文字並標示，
// 由瀏覽器自己完成，我們不需要、也不可能去碰對方頁面的內容。
// Chrome／Edge／Safari 支援，Firefox 會安靜忽略。
//
// 完整語法是 text=[前綴-,]起點[,終點][,-後綴]，用逗號分段：
//   起點          捲到第一個出現的位置
//   起點,終點      先找到起點，再往下找最近的終點，中間整段圈起來。
//                 想標的東西每筆都不同（例如售價）就靠這招夾住它。
//   前綴-,起點     前綴要緊貼在起點前面，用來指定是哪一個
//   起點,-後綴     後綴要緊貼在起點後面，同上
// 段落內部的「-」編碼成 %2D，才不會被誤認成上面那兩個標記。
const searchURL = n => {
  const q = SEARCH.url + encodeURIComponent(SEARCH.extra ? n + ' ' + SEARCH.extra : n);
  const raw = (SEARCH.mark || '').split(',').map(t => t.trim()).filter(Boolean).slice(0, 4);
  const parts = raw.map((t, i) => {
    const pre = i === 0 && raw.length > 1 && t.endsWith('-');
    const suf = i === raw.length - 1 && raw.length > 1 && t.startsWith('-');
    const body = pre ? t.slice(0, -1) : suf ? t.slice(1) : t;
    const enc = encodeURIComponent(body).replace(/-/g, '%2D');
    return pre ? enc + '-' : suf ? '-' + enc : enc;
  }).filter(t => t && t !== '-');
  return parts.length ? q + '#:~:text=' + parts.join(',') : q;
};

function rowEl(it){
  const li = document.createElement('li');
  const row = document.createElement('div');
  row.className = 'row';
  row.tabIndex = 0;
  row.setAttribute('role', 'button');
  row.setAttribute('aria-expanded', 'false');

  const k = kOf(it);
  let tags = '';
  if (k) tags += `<span class="tag coin">${COIN ? '已折酷幣' : '酷幣'} ${NT(k)}</span>`;
  if (it.x) tags += `<span class="tag gone">已下架 ${it.l}</span>`;
  if (it.a && it.a.length) tags += `<span class="tag alias">改過名</span>`;
  else if (it.np > 1 && it.p <= it.lo) tags += '<span class="tag lowest">歷史低點</span>';

  let delta = '<span style="color:var(--dim)">—</span>';
  if (it.pv !== null){
    const d = it.p - it.pv, cls = d > 0 ? 'up' : 'down';
    const pct = (d / it.pv * 100).toFixed(1);
    delta = `<span class="${cls}">${d > 0 ? '▲' : '▼'}${NT(Math.abs(d))}` +
            ` (${d > 0 ? '+' : ''}${pct}%) ${it.pd.slice(5)}</span>`;
  }

  row.innerHTML =
    `<div class="name">${esc(showName(it.n))}${tags}</div>` +
    `<div class="price">$${NT(netOf(it))}</div>` +
    `<a class="cmp" href="${esc(searchURL(it.n))}" target="_blank" rel="noopener"` +
    ` title="用完整品名到 Google 搜尋，開新分頁">比價</a>` +
    `<div class="meta">${esc(it.c)}${it.g ? ' · ' + esc(it.g) : ''}</div>` +
    `<div class="delta">${delta}</div>`;

  const toggle = () => openDetail(li, row, it);
  // 按比價不要順便把那一列展開
  row.addEventListener('click', e => {
    if (e.target.closest('.cmp')) return;
    toggle();
  });
  row.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); }
  });
  li.appendChild(row);
  return li;
}

async function openDetail(li, row, it){

async function loadHistory(id){
  const key = id.slice(0,2);
  if (!shardCache.has(key)){
    shardCache.set(key, fetch(base + 'data/hist/' + key + '.json')
      .then(r => r.ok ? r.json() : {}));
  }
  const shard = await shardCache.get(key);
  return shard[id] || [];
}

function spikes(series){
  // 單點暴衝後立即回到原價，判定為來源站標價錯誤（例如 $1690 誤植為 $16690）
  // 存日期不存索引：裁切區間之後索引會位移，日期不會。
  const bad = new Set();
  for (let i = 1; i < series.length - 1; i++){
    const a = series[i-1][1], b = series[i][1], c = series[i+1][1];
    if (Math.abs(b-a)/a > 2 && Math.abs(c-a)/a < 0.3) bad.add(series[i][0]);
  }
  return bad;
}

const RANGES = { w:['週',7], m:['月',30], q:['季',91], y:['年',365], all:['全部',0] };
let RANGE = 'm';            // 預設看最近一個月

// 把歷史裁成指定區間。關鍵是要把「區間開始前的最後一個價格」一起帶進來，
// 否則圖的起點會變成區間內第一次變價，而不是那個區間一開始的實際價格。
function windowed(series, it, bad){
  bad = bad || new Set();
  const endT = it.x ? Date.parse(it.l) : Date.now();
  const days = RANGES[RANGE][1];
  const firstT = Date.parse(series[0][0]);
  if (!days) return { pts: series, startT: firstT, endT, carried: false };
  // 區間比這支商品的歷史還長時，起點收到第一筆，免得畫出一大片空白
  const startT = Math.max(endT - days * 864e5, firstT);
  const inWin = series.filter(p => Date.parse(p[0]) >= startT);
  // 帶入的起始價格要跳過標錯的點，否則區間邊界外剛好有個錯價時，
  // 整張圖會從那個錯價開始。
  const before = series
    .filter(p => Date.parse(p[0]) < startT && !bad.has(p[0])).slice(-1);
  return { pts: [...before, ...inWin], startT, endT, carried: before.length > 0 };
}

function rangeBar(){
  return '<div class="ranges">' + Object.keys(RANGES).map(k =>
    `<button class="sortbtn" type="button" data-range="${k}"` +
    ` aria-pressed="${RANGE === k}">${RANGES[k][0]}</button>`).join('') + '</div>';
}

function detailHTML(it, series){
  const span = series.length > 1
    ? `${series[0][0]} 起 · 變價 ${series.length - 1} 次`
    : `${it.f} 起 · 尚未變過價`;
  const bad = spikes(series);
  const stats =
    `<div class="stats">` +
    `<span>最低<b>$${NT(it.lo)}</b></span>` +
    `<span>最高<b>$${NT(it.hi)}</b></span>` +
    `<span>現價<b>$${NT(netOf(it))}</b></span>` +
    `<span>${span}</span></div>`;
  const coin = kOf(it)
    ? `<div class="pts">酷幣可折 $${NT(kOf(it))}，折抵後 $${NT(it.p - kOf(it))}。` +
      `走勢圖與最高最低價都是原價，酷幣額度沒有逐日記錄。</div>` : '';
  const alias = (it.a && it.a.length)
    ? `<div class="pts">曾用名：${it.a.map(n => esc(showName(n))).join('　／　')}</div>` : '';
  const win = windowed(series, it, bad);
  const nBad = win.pts.filter(p => bad.has(p[0])).length;
  const warn = nBad
    ? `<div class="pts warn">這個區間內有 ${nBad} 個價位暴衝後隨即回復，` +
      `多半是來源站當天標錯，圖上以空心點標示。</div>` : '';
  const quiet = (series.length > 1 && win.pts.length < 2)
    ? `<div class="pts">這個區間內沒有變過價。</div>` : '';
  return stats + rangeBar() + chartSVG(win, it, bad, series.length) + quiet + coin + warn +
    `<div class="pts">${series.slice(-6).reverse()
      .map(p => `${p[0]} $${NT(p[1])}`).join('　')}</div>` + alias;
}

function chartSVG(win, it, bad, fullLen){
  bad = bad || new Set();
  if (fullLen < 2)
    return '<div class="pts">目前只有一個價格點，等價格變動後就會出現走勢圖。</div>';

  const W = 640, H = 150, L = 56, R = 10, T = 12, B = 24;
  const x0 = win.startT, x1 = win.endT;
  // 帶進來的那個點畫在區間左緣：它的實際日期在區間之外
  const pts = win.pts.map(([d,p]) => [Math.max(Date.parse(d), x0), p]);
  // 將最後一個價格延伸至區間右緣，以反映該價格持續至今
  if (x1 > pts[pts.length-1][0]) pts.push([x1, pts[pts.length-1][1]]);

  const ys = pts.map(p => p[1]);
  // 計算縱軸範圍時排除標錯的點，避免圖形被壓縮
  const sane = win.pts.filter(p => !bad.has(p[0])).map(p => p[1]);
  const ysr = sane.length ? sane : ys;
  let y0 = Math.min(...ysr), y1 = Math.max(...ysr);
  const pad = (y1 - y0) * 0.15 || Math.max(y1 * 0.02, 1);
  y0 -= pad; y1 += pad;
  const X = t => L + (x1 === x0 ? 0 : (t - x0) / (x1 - x0)) * (W - L - R);
  const Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);

  // 階梯線：價格在下次調整前維持不變
  let d = `M${X(pts[0][0]).toFixed(1)},${Math.max(T-4, Math.min(H-B+4, Y(pts[0][1]))).toFixed(1)}`;
  for (let i = 1; i < pts.length; i++){
    d += `H${X(pts[i][0]).toFixed(1)}`;
    if (pts[i][1] !== pts[i-1][1])
      d += `V${Math.max(T-4, Math.min(H-B+4, Y(pts[i][1]))).toFixed(1)}`;
  }

  const lo = Math.min(...ysr), hi = Math.max(...ysr);
  const grid = [hi, lo].map(v =>
    `<line class="axis" x1="${L}" y1="${Y(v).toFixed(1)}" x2="${W-R}" y2="${Y(v).toFixed(1)}"/>` +
    `<text x="${L-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${NT(v)}</text>`
  ).join('');

  const clamp = v => Math.max(T-4, Math.min(H-B+4, Y(v)));
  const dots = win.pts
    .filter((p, i) => !(i === 0 && win.carried))
    .map(([dt,p]) =>
      `<circle class="dot${bad.has(dt)?' bad':''}" cx="${X(Date.parse(dt)).toFixed(1)}"` +
      ` cy="${clamp(p).toFixed(1)}" r="3">` +
      `<title>${dt}　$${NT(p)}${bad.has(dt)?'（疑似標錯）':''}</title></circle>`).join('');

  const fmt = t => new Date(t).toISOString().slice(5,10).replace('-','/');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
    role="img" aria-label="價格走勢，最低 ${lo}，最高 ${hi}">
    ${grid}<path class="line" d="${d}"/>${dots}
    <text x="${L}" y="${H-6}">${fmt(x0)}</text>
    <text x="${W-R}" y="${H-6}" text-anchor="end">${fmt(x1)}</text></svg>`;
}

  if (c){
    try {
      await navigator.clipboard.writeText(c.dataset.copy);
      c.textContent = '已複製';
    } catch (err){
      c.textContent = c.dataset.copy;   // 不給複製就直接把日期顯示出來讓你選取
    }
    setTimeout(() => { c.textContent = '複製日期'; }, 2500);
    return;
  }
  const b = e.target.closest('[data-range]');
  if (!b) return;
  RANGE = b.dataset.range;
  const box = OPEN && OPEN.querySelector('.detail');
  if (box && OPEN_IT) box.innerHTML = detailHTML(OPEN_IT, OPEN_SERIES);
});
$('#sorts').addEventListener('click', e => {
  const b = e.target.closest('[data-sort]');
  if (!b) return;
  const k = b.dataset.sort;
  if (SORT === k) SORT_DIR = -SORT_DIR;   // 再按一次同一個就換方向
  else { SORT = k; SORT_DIR = 1; }
  render();
});
$('#refresh').addEventListener('click', async () => {
  const b = $('#refresh');
  b.disabled = true;
  b.textContent = '更新中…';
  let msg;
  try {
    msg = await loadData(true) ? '沒有新資料' : '已更新';
  } catch (e){
    msg = '更新失敗';
  }
  b.textContent = msg;
  setTimeout(() => { b.disabled = false; b.textContent = '立刻更新'; }, 2500);
});
$('#cat').addEventListener('change', () => {
  // 換分類時舊的次類與規格勾選都失效，一併清掉
  SUBS = null;
  COIN_ONLY = false;
  for (const k of Object.keys(PICKED)) delete PICKED[k];
  EXPANDED.clear();
  render();
});
$('#subs').addEventListener('change', e => {
  const cb = e.target.closest('input');
  if (!cb) return;
  if (cb.hasAttribute('data-coin-only')){
    COIN_ONLY = cb.checked;
    render();
    return;
  }
  if (cb.hasAttribute('data-all')){
    SUBS = cb.checked ? null : new Set();
  } else {
    if (!SUBS) SUBS = new Set(SUB_DOMAIN);
    cb.checked ? SUBS.add(cb.dataset.sub) : SUBS.delete(cb.dataset.sub);
    if (SUBS.size === SUB_DOMAIN.length) SUBS = null;
  }
  render();
});
$('#facets').addEventListener('click', e => {
  const more = e.target.closest('[data-more]');
  if (more){
    const k = more.dataset.more;
    EXPANDED.has(k) ? EXPANDED.delete(k) : EXPANDED.add(k);
    render();
    return;
  }
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const { f, v } = chip.dataset;
  PICKED[f] = PICKED[f] || new Set();
  PICKED[f].has(v) ? PICKED[f].delete(v) : PICKED[f].add(v);
  render();
});
$('#reset').addEventListener('click', () => {
  $('#cat').value = '';
  SUBS = null;
  COIN_ONLY = false;
  for (const k of Object.keys(PICKED)) delete PICKED[k];
  EXPANDED.clear();
  render();
});
</script>
</body>
</html>

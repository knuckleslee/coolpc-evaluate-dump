name: 抓取價格

on:
  schedule:
    # timezone 是 2026-03 才有的欄位，可以直接寫台灣時間，不必自己減 8 小時。
    # 萬一 GitHub 忽略這個欄位，10:05 會變成 UTC 的 10:05，也就是台灣的 18:05——
    # 只是時間跑掉，不會壞掉。跑第一次後到 Actions 確認實際觸發時間。
    - cron: '5 10 * * *'
      timezone: 'Asia/Taipei'
    - cron: '5 22 * * *'
      timezone: 'Asia/Taipei'
  workflow_dispatch:        # 讓你可以在網頁上手動按一下就跑
    inputs:
      rollback:
        description: '要當作沒抓過的日期 YYYY-MM-DD（留空＝正常抓取）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      # 排程觸發時 github.event.inputs 是空的，這個條件會成立，照常抓取
      - name: 抓取並解析
        if: github.event.inputs.rollback == ''
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          REDACT_WORDS: ${{ secrets.REDACT_WORDS }}
        run: python scripts/scrape.py

      - name: 把某一次抓取當作沒發生過
        if: github.event.inputs.rollback != ''
        run: python scripts/rollback.py "${{ github.event.inputs.rollback }}"

      - name: 存檔
        run: |
          git config user.name  "price-tracker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "資料沒有變動，這次不建立紀錄"
            exit 0
          fi
          if [ -n "${{ github.event.inputs.rollback }}" ]; then
            git commit -m "刪除 ${{ github.event.inputs.rollback }} 的抓取紀錄"
          else
            git commit -m "價格更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          fi
          git pull --rebase --autostash
          git push

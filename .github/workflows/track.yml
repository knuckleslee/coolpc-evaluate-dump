name: 抓取價格

on:
  schedule:
    # 台灣時間每天 10:30 到 22:30，每小時第 30 分，一天 13 次。
    # cron 一律以 UTC 解讀，台灣 = UTC+8，所以台灣 10:30～22:30 ＝ UTC 02:30～14:30。
    # 不使用 timezone 欄位，避免換算方式有任何不確定。
    #
    # 注意：GitHub 的排程只保證「盡量」，實測這個 repo 會延遲好幾個小時才觸發。
    # 詳見 README 的「排程時間」。
    - cron: '30 2-14 * * *'
  workflow_dispatch:        # 讓你可以在網頁上手動按一下就跑
    inputs:
      rollback:
        description: '要當作沒抓過的日期 YYYY-MM-DD（留空＝正常抓取）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      # 排程觸發時沒有 rollback 輸入，手動觸發時留空，這兩種情況都照常抓取
      - name: 抓取並解析
        if: github.event.inputs.rollback == ''
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          REDACT_WORDS: ${{ secrets.REDACT_WORDS }}
          # 沒設定就只把通知內容印在紀錄裡，不會報錯
          CHAT_WEBHOOK: ${{ secrets.CHAT_WEBHOOK }}
        run: python scripts/scrape.py

      - name: 把某一次抓取當作沒發生過
        if: github.event.inputs.rollback != ''
        run: python scripts/rollback.py "${{ github.event.inputs.rollback }}"

      - name: 存檔
        run: |
          git config user.name  "price-tracker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "資料沒有變動，這次不建立紀錄"
            exit 0
          fi
          if [ -n "${{ github.event.inputs.rollback }}" ]; then
            git commit -m "刪除 ${{ github.event.inputs.rollback }} 的抓取紀錄"
          else
            git commit -m "價格更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          fi
          git pull --rebase --autostash
          git push

name: 抓取價格

on:
  schedule:
    # 台灣時間每天 10:30 到 22:30，每小時第 30 分，一天 13 次。
    #
    # 這裡刻意寫 UTC、不用 timezone 欄位：實際紀錄顯示 timezone: 'Asia/Taipei'
    # 沒有照預期生效——舊排程寫 10:05／22:05，卻一直在台灣時間凌晨兩點多和
    # 下午三點左右觸發，22:05 那次從來沒出現過。UTC 寫法沒有這種不確定性。
    #
    # 台灣 = UTC+8，所以台灣 10:30～22:30 ＝ UTC 02:30～14:30。
    # 選第 30 分是避開整點：GitHub 每個整點負載最高，排程最容易延遲或被丟掉。
    - cron: '30 2-14 * * *'
  workflow_dispatch:        # 讓你可以在網頁上手動按一下就跑
    inputs:
      rollback:
        description: '要當作沒抓過的日期 YYYY-MM-DD（留空＝正常抓取）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      # 排程觸發時 github.event.inputs 是空的，這個條件會成立，照常抓取
      - name: 抓取並解析
        if: github.event.inputs.rollback == ''
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          REDACT_WORDS: ${{ secrets.REDACT_WORDS }}
          # 沒設定就只把通知內容印在紀錄裡，不會報錯
          CHAT_WEBHOOK: ${{ secrets.CHAT_WEBHOOK }}
        run: python scripts/scrape.py

      - name: 把某一次抓取當作沒發生過
        if: github.event.inputs.rollback != ''
        run: python scripts/rollback.py "${{ github.event.inputs.rollback }}"

      - name: 存檔
        run: |
          git config user.name  "price-tracker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "資料沒有變動，這次不建立紀錄"
            exit 0
          fi
          if [ -n "${{ github.event.inputs.rollback }}" ]; then
            git commit -m "刪除 ${{ github.event.inputs.rollback }} 的抓取紀錄"
          else
            git commit -m "價格更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          fi
          git pull --rebase --autostash
          git push

name: 抓取價格

on:
  # ── GitHub 內建排程：已關閉，程式保留 ──
  # 現在改由 Google Apps Script 每小時呼叫下面的 workflow_dispatch 觸發（apps-script/trigger.gs）。
  # 關掉的原因：內建排程在這個 repo 大部分時段直接被丟掉，跑的那幾次也晚好幾個小時，
  # 而且常落在半夜。
  #
  # 要恢復：把下面兩行最前面的「# 」拿掉（schedule 要跟 workflow_dispatch 對齊）。
  # cron 以 UTC 解讀，'30 2-14 * * *' ＝ 台灣時間 10:30～22:30 每小時一次。
  # schedule:
  #   - cron: '30 2-14 * * *'
  workflow_dispatch:        # 讓你可以在網頁上手動按一下就跑
    inputs:
      rollback:
        description: '要當作沒抓過的日期 YYYY-MM-DD（留空＝正常抓取）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      # Apps Script 觸發與手動觸發時 rollback 都是空字串，照常抓取
      - name: 抓取並解析
        if: github.event.inputs.rollback == ''
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          REDACT_WORDS: ${{ secrets.REDACT_WORDS }}
          # 沒設定就只把通知內容印在紀錄裡，不會報錯
          CHAT_WEBHOOK: ${{ secrets.CHAT_WEBHOOK }}
        run: python scripts/scrape.py

      - name: 把某一次抓取當作沒發生過
        if: github.event.inputs.rollback != ''
        run: python scripts/rollback.py "${{ github.event.inputs.rollback }}"

      - name: 存檔
        run: |
          git config user.name  "price-tracker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "資料沒有變動，這次不建立紀錄"
            exit 0
          fi
          if [ -n "${{ github.event.inputs.rollback }}" ]; then
            git commit -m "刪除 ${{ github.event.inputs.rollback }} 的抓取紀錄"
          else
            git commit -m "價格更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          fi
          git pull --rebase --autostash
          git push
